name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # معرّفات تجريبية. غيّرها بمعرّفاتك من AdMob لما تجهز
      ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"
      ADMOB_BANNER_ID: "ca-app-pub-3940256099942544/6300978111"
      ADMOB_TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          sed -i "s#__BANNER_ID__#${ADMOB_BANNER_ID}#g; s#__TESTING__#${ADMOB_TESTING}#g" www/index.html
      - name: Add Android
        run: npx cap add android
      - name: Add AdMob app id
        run: |
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${ADMOB_APP_ID}\"/></application>#" android/app/src/main/AndroidManifest.xml
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: german-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
